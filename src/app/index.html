<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Kept in step with src/shell/index.template.html, which is the production page. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Shopping List</title>
  </head>
  <body>
    <!--
      This file is the Vite entry, and it is what `npm run dev` serves. It is NOT the
      page users load in production: the build parses it for the emitted asset URLs and

      Anything added here will be absent in production unless it also exists in the
      bootloader template.
    -->
    <div id="app"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
